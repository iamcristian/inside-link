name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      TURSO_DATABASE_URL: ":memory:"
      BETTER_AUTH_SECRET: local-verification-only-secret-0123456789
      BETTER_AUTH_URL: http://localhost:3000
      GITHUB_CLIENT_ID: dummy_client_id
      GITHUB_CLIENT_SECRET: dummy_client_secret
      ALLOWED_GITHUB_ID: "12345"
      ALLOWED_GITHUB_EMAIL: owner@example.com
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.11.2
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm exec next typegen
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
